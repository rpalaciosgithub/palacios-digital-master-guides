<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stage 1 Power Verbs</title>
<style>
body{font-family:Arial,sans-serif;padding:28px;background:#f7f2e8;color:#17365d}
#m{font-size:22px;font-weight:700;line-height:1.5}
</style>
</head><body><div id="m">Loading Stage 1 Power Verbs…</div>
<script>
(async()=>{
 try{
  const stamp='stage1-official-v3-20260918';
  const [base,tmpl]=await Promise.all([
   fetch('stage1-audio-base.html?'+stamp,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Stage 1 audio base');return r.text()}),
   fetch('stage1-iphone-gustar-mixboost-v3.html?'+stamp,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load final Stage 1 template');return r.text()})
  ]);
  const mm=base.match(/const\s+RECORDED_AUDIO_SRC\s*=\s*["'](data:audio\/mpeg;base64,[A-Za-z0-9+/=]+)["'];/);
  if(!mm)throw new Error('Main recording not found');
  const html=tmpl.replace('__MAIN_AUDIO_DATA_URI__',mm[1]);
  document.open(); document.write(html); document.close();
 }catch(e){
  document.getElementById('m').textContent='Load error: '+e.message;
 }
})();
</script></body></html>
