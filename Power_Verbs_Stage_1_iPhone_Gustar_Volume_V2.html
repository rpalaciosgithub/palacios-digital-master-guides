<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stage 1 iPhone Gustar Volume V2</title>
<style>body{font-family:Arial,sans-serif;padding:28px;background:#f7f2e8;color:#17365d}#m{font-size:22px;font-weight:700;line-height:1.5}</style>
</head><body><div id="m">Loading Gustar Volume Fix V2…</div>
<script>
(async()=>{
 try{
  const stamp='gustar-volume-v2-20260918';
  const [base,tmpl]=await Promise.all([
   fetch('Power_Verbs_Stage_1.html?'+stamp,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Stage 1 master');return r.text()}),
   fetch('stage1-iphone-gustar-volume-v2.html?'+stamp,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Gustar V2 template');return r.text()})
  ]);
  const mm=base.match(/const\s+RECORDED_AUDIO_SRC\s*=\s*["'](data:audio\/mpeg;base64,[A-Za-z0-9+/=]+)["'];/);
  if(!mm)throw new Error('Main recording not found');
  const html=tmpl.replace('__MAIN_AUDIO_DATA_URI__',mm[1]);
  document.open(); document.write(html); document.close();
 }catch(e){document.getElementById('m').textContent='Load error: '+e.message}
})();
</script></body></html>
