<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>iPhone Power Verb Audio Test</title><style>body{font-family:Arial,sans-serif;background:#f7f2e8;padding:24px;max-width:650px;margin:auto}h1{color:#17365d}p{font-size:19px;color:#52606d}button{display:block;width:100%;font-size:28px;font-weight:700;padding:20px;margin:14px 0;border-radius:16px;border:2px solid #17365d;background:#fff;color:#17365d}</style></head><body><h1>iPhone Audio Test</h1><p>Test only these four corrected recordings.</p><button data-src="iphone-audio/gustar.mp3">▶ Gustar</button><button data-src="iphone-audio/ir-a.mp3">▶ Ir a</button><button data-src="iphone-audio/yo-voy-a.mp3">▶ Yo voy a</button><button data-src="iphone-audio/tu-vas-a.mp3">▶ Tú vas a</button><script>let a=null;document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(a){a.pause();a.currentTime=0}a=new Audio(b.dataset.src+'?v=20260913');a.playsInline=true;a.play().catch(e=>alert('Audio error: '+e.message));}));</script></body></html>
