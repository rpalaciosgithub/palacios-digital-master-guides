<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>iPhone Power Verb Audio Test v3</title><style>body{font-family:Arial,sans-serif;background:#f7f2e8;padding:24px;max-width:650px;margin:auto}h1{color:#17365d}p{font-size:19px;color:#52606d}button{display:block;width:100%;font-size:28px;font-weight:700;padding:20px;margin:14px 0;border-radius:16px;border:2px solid #17365d;background:#fff;color:#17365d}</style></head><body><h1>iPhone Audio Test v3</h1><p>Gustar, Yo voy a, and Tú vas a are unchanged. Only Ir a was adjusted so the borrowed final a starts later, inside the pure vowel.</p><button data-mode="gustar">▶ Gustar</button><button data-mode="ir">▶ Ir a</button><button data-mode="voy">▶ Yo voy a</button><button data-mode="vas">▶ Tú vas a</button><script>const U='iphone-audio/';let a1=null,a2=null,t=null;function stop(){if(t)clearInterval(t);t=null;for(const a of[a1,a2])if(a){try{a.pause()}catch(e){}}a1=a2=null}function playFile(src,start=0,end=null,onend=null){const a=new Audio(U+src+'?v=20260913c');a.playsInline=true;a1=a;a.addEventListener('loadedmetadata',()=>{a.currentTime=start;const p=a.play();if(p)p.catch(()=>{});if(end!=null)t=setInterval(()=>{if(a.currentTime>=end){clearInterval(t);t=null;a.pause();if(onend)onend()}},20)},{once:true});a.load()}function playWithSkip(src,skipStart,skipTo,end){const a=new Audio(U+src+'?v=20260913c');a.playsInline=true;a1=a;a.addEventListener('loadedmetadata',()=>{a.currentTime=0;const p=a.play();if(p)p.catch(()=>{});let jumped=false;t=setInterval(()=>{if(!jumped&&a.currentTime>=skipStart){jumped=true;a.currentTime=skipTo}if(a.currentTime>=end){clearInterval(t);t=null;a.pause()}},20)},{once:true});a.load()}function cleanA(){const a=new Audio(U+'yo-voy-a.mp3?v=20260913c');a.playsInline=true;a2=a;a.addEventListener('loadedmetadata',()=>{a.currentTime=.885;const p=a.play();if(p)p.catch(()=>{});let z=setInterval(()=>{if(a.currentTime>=1.035){clearInterval(z);a.pause()}},20)},{once:true});a.load()}document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{stop();const m=b.dataset.mode;if(m==='gustar')playFile('gustar.mp3');if(m==='ir')playFile('ir-a.mp3',0,.30,()=>setTimeout(cleanA,160));if(m==='voy')playWithSkip('yo-voy-a.mp3',.551,.682,1.055);if(m==='vas')playWithSkip('tu-vas-a.mp3',.581,.715,1.082)}));</script></body></html>
