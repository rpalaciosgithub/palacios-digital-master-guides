<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>iPhone Power Verb Audio Test v4</title><style>body{font-family:Arial,sans-serif;background:#f7f2e8;padding:24px;max-width:650px;margin:auto}h1{color:#17365d}p{font-size:19px;color:#52606d}button{display:block;width:100%;font-size:28px;font-weight:700;padding:20px;margin:14px 0;border-radius:16px;border:2px solid #17365d;background:#fff;color:#17365d}</style></head><body><h1>iPhone Audio Test v4</h1><p>Gustar unchanged. Yo voy a and Tú vas a restored to the better timing. Ir a now plays one finished MP3 with the pause built into the file.</p><button data-mode="gustar">▶ Gustar</button><button data-mode="ir">▶ Ir a</button><button data-mode="voy">▶ Yo voy a</button><button data-mode="vas">▶ Tú vas a</button><script>const U='iphone-audio/';let a=null,t=null;function stop(){if(t)clearInterval(t);t=null;if(a){try{a.pause()}catch(e){}}a=null}function play(src){stop();a=new Audio(src);a.playsInline=true;a.play().catch(e=>alert('Audio error: '+e.message));}function playWithSkip(src,skipStart,skipTo,end){stop();a=new Audio(U+src+'?v=20260913d');a.playsInline=true;a.addEventListener('loadedmetadata',()=>{a.currentTime=0;const p=a.play();if(p)p.catch(()=>{});let jumped=false;t=setInterval(()=>{if(!jumped&&a.currentTime>=skipStart){jumped=true;a.currentTime=skipTo}if(a.currentTime>=end){clearInterval(t);t=null;a.pause()}},20)},{once:true});a.load()}document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const m=b.dataset.mode;if(m==='gustar')play(U+'gustar.mp3?v=20260913d');if(m==='ir')play(U+'ir-a-v2.mp3?v=20260913d');if(m==='voy')playWithSkip('yo-voy-a.mp3',.551,.682,1.055);if(m==='vas')playWithSkip('tu-vas-a.mp3',.581,.715,1.082)}));</script></body></html>
